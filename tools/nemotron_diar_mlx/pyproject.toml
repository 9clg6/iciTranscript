[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-diar-mlx"
version = "0.1.0"
description = "Portage MLX (Apple Silicon) de NVIDIA Nemotron 3 Diarization"
readme = "README.md"
# mlx ne publie pas encore de wheel pour Python 3.15.
requires-python = ">=3.10,<3.15"
dependencies = ["mlx>=0.29", "numpy"]

[project.optional-dependencies]
# Conversion .nemo -> MLX (lecture du checkpoint PyTorch).
convert = ["torch", "pyyaml"]
# Comparaison avec l'implémentation de référence NeMo.
parity = ["nemo_toolkit[asr]", "soundfile"]

[tool.setuptools.packages.find]
include = ["nemotron_diar_mlx"]
